<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Travel Map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
</head>
<body>
<div id="map"></div>
<div id="topbar">
  <button id="home" title="여행 목록">⌂ 홈</button>
  <span id="tripname"></span>
  <span id="mapstatus"></span>
  <span class="spacer"></span>
  <button data-map="street" class="mapbtn on">🗺 일반</button>
  <button data-map="sat" class="mapbtn">🛰 위성</button>
  <button data-map="terrain" class="mapbtn">⛰ 지형</button>
</div>
<div id="trips" class="hidden">
  <div class="trow"><h2>여행 선택</h2><span class="spacer"></span><button id="tripAdd" class="hidden">+ 새 폴더</button></div>
  <div id="tripNote"></div>
  <div id="triplist"></div>
</div>
<div id="hud" class="hidden">
  <div id="title"><span id="stats"></span></div>
  <div id="controls">
    <button id="prev">◀</button>
    <button id="play">▶ 재생</button>
    <button id="next">▶</button>
    <button id="first" title="첫 사진 위치로">⏮ 처음</button>
    <input id="scrub" type="range" min="0" max="0" value="0" step="1">
    <span id="speeds">
      <button data-s="0.5">0.5x</button><button data-s="1" class="on">1x</button><button data-s="2">2x</button><button data-s="4">4x</button>
    </span>
    <button id="manualBtn" title="GPS 없는 구간 위치 직접 지정">📍 위치지정</button>
    <label><input type="checkbox" id="showHeld" checked> 추정 표시</label>
    <label><input type="checkbox" id="follow" checked> 따라가기</label>
  </div>
  <div id="cur"></div>
</div>
<div id="panel" class="hidden">
  <button id="close">✕</button>
  <div id="media"></div>
  <div id="info"></div>
</div>
<div id="manual" class="hidden">
  <button id="mclose">✕</button>
  <h3>📍 위치 직접 지정</h3>
  <div class="mrow"><input id="mq" placeholder="예: 청주국제공항"><button id="msearch">검색</button></div>
  <div id="mresults"></div>
  <div id="mscope" class="hidden">
    <div id="mplace"></div>
    <label><input type="radio" name="mscope" value="current" checked> 지금 보고 있는 사진 1장 (<span id="mcurN" title=""></span>)</label><br>
    <label><input type="radio" name="mscope" value="before"> 첫 GPS 이전 사진 전부 (<span id="mbeforeN"></span>장)</label><br>
    <label><input type="radio" name="mscope" value="range"> 시간 범위 지정</label>
    <div class="mrow"><input id="mfrom" type="datetime-local"><span>~</span><input id="mto" type="datetime-local"></div>
    <button id="mapply">적용</button>
  </div>
  <h4>지정 목록</h4>
  <div id="mrules"></div>
  <div class="mrow"><button id="mexport">내보내기</button><button id="mimportBtn">가져오기</button><input id="mimport" type="file" accept=".json" class="hidden"></div>
</div>
<script src="app.js"></script>
</body>
</html>
