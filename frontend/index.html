<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Travel Map</title>
<link rel="stylesheet" href="https://unpkg.com/cesium@1.121.0/Build/Cesium/Widgets/widgets.css">
<link rel="stylesheet" href="style.css">
<script>window.CESIUM_BASE_URL = "https://unpkg.com/cesium@1.121.0/Build/Cesium/";</script>
<script src="https://unpkg.com/cesium@1.121.0/Build/Cesium/Cesium.js"></script>
</head>
<body>
<div id="cesium"></div>
<div id="topbar">
  <button id="home" title="여행 목록">⌂ 홈</button>
  <span id="tripname"></span>
  <span id="mapstatus"></span>
  <span class="spacer"></span>
  <button data-map="street" class="mapbtn on">🗺 일반</button>
  <button data-map="sat" class="mapbtn">🛰 위성</button>
  <button data-map="carto" class="mapbtn">⛰ 지형</button>
</div>
<div id="trips" class="hidden"><h2>여행 선택</h2><div id="triplist"></div></div>
<div id="hud" class="hidden">
  <div id="title"><span id="stats"></span></div>
  <div id="controls">
    <button id="prev">◀</button>
    <button id="play">▶ 재생</button>
    <button id="next">▶</button>
    <button id="first" title="첫 사진 위치로">⏮ 처음</button>
    <input id="scrub" type="range" min="0" max="0" value="0" step="1">
    <span id="speeds">
      <button data-s="0.5">0.5x</button><button data-s="1" class="on">1x</button><button data-s="2">2x</button><button data-s="4">4x</button>
    </span>
    <label><input type="checkbox" id="showHeld" checked> 추정 표시</label>
    <label><input type="checkbox" id="follow" checked> 따라가기</label>
  </div>
  <div id="cur"></div>
</div>
<div id="panel" class="hidden">
  <button id="close">✕</button>
  <div id="media"></div>
  <div id="info"></div>
</div>
<script src="app.js"></script>
</body>
</html>
